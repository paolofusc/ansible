name: Run AOS-CX Command

on:
  workflow_dispatch:
    inputs:
      blocks_json:
        description: 'Multi-block configuration (JSON array containing up to 10 device blocks)'
        required: false
        type: string
      hostname:
        description: 'Single-block fallback: Hostname(s) or IP(s)'
        required: false
        type: string
      command:
        description: 'Single-block fallback: Command to run'
        required: false
        type: string
      runner_type:
        description: 'Runner environment'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  execute-playbook:
    runs-on: ${{ inputs.runner_type || 'self-hosted' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ansible (if ubuntu-latest)
        if: inputs.runner_type == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip python3-yaml
          pip install ansible-core paramiko
          ansible-galaxy collection install arubanetworks.aoscx

      - name: Check Ansible Version
        run: ansible-playbook --version

      - name: Clean Previous Run Outputs
        run: |
          rm -f *_output.txt *_error.txt dynamic_inventory.ini dynamic_playbook.yml summary_blocks.json

      - name: Prepare Multi-Block Execution
        env:
          INPUT_BLOCKS_JSON: ${{ inputs.blocks_json }}
          INPUT_HOSTNAME: ${{ inputs.hostname }}
          INPUT_COMMAND: ${{ inputs.command }}
        run: |
          python3 src/prepare_execution.py

      - name: Run Ansible Playbook
        id: run_playbook
        env:
          SSH_USER: ${{ secrets.SSH_ANSIBLE_USER }}
          SSH_PASS: ${{ secrets.SSH_ANSIBLE_PASSWORD }}
          ANSIBLE_CONFIG: ${{ github.workspace }}/src/ansible.cfg
        run: |
          ansible-playbook -i dynamic_inventory.ini dynamic_playbook.yml \
            -e "ansible_user=$SSH_USER" \
            -e "ansible_password=$SSH_PASS"

      - name: Publish Results to GitHub Step Summary
        if: always()
        env:
          RUNNER_TYPE: ${{ inputs.runner_type }}
          PLAYBOOK_OUTCOME: ${{ steps.run_playbook.outcome }}
        run: |
          python3 src/publish_summary.py
